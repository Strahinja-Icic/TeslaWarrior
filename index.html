<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeslaWarrior - GAME</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>
        TeslaWarrior
    </h1>

    <div>
        <p id="playerStats"></p>
        <p id="enemyStats"></p>
    </div>

    <button id="attackButton">Attack</button>   <!-- Refrain from removing the elements which have id's assigned to them, they're needed in order for the game to function. You're allowed to reposition and style them though. -->
    <button id="defendButton">Skip turn</button>    <!-- Will be converted into a button for defending attacks later, for now it is used to skip turns in the battle -->
    <button id="checkButton">Check</button>
    <button id="cItemButton">Use consumable item</button>
    <button id="clearButton">Clear output</button>
    <button id="restartBattle">Restart battle</button>

    <p id="output"></p>
    <p>thing</p>

    <script src="script.js">

    </script>
</body>
</html>
